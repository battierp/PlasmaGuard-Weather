name: Build PlasmaSky APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-release
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK path not set"
            exit 1
          fi
          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK_ROOT/licenses/intel-android-extra-license"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare debug signing keystore
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '\r\n[:space:]' | base64 -d > debug.keystore
            echo "mode=persistent_secret" >> "$GITHUB_OUTPUT"
          elif git fetch --depth=1 origin ci-signing:refs/remotes/origin/ci-signing >/dev/null 2>&1 \
            && git show origin/ci-signing:debug.keystore.base64 > ci_signing.base64.tmp 2>/dev/null \
            && [ -s ci_signing.base64.tmp ]; then
            tr -d '\r\n[:space:]' < ci_signing.base64.tmp | base64 -d > debug.keystore
            rm -f ci_signing.base64.tmp
            echo "mode=persistent_ci_branch" >> "$GITHUB_OUTPUT"
          else
            rm -f ci_signing.base64.tmp
            if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
              tr -d '\r\n[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
              echo "mode=persistent_repo" >> "$GITHUB_OUTPUT"
            elif [ ! -f debug.keystore ]; then
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "mode=persistent_ci_branch_init" >> "$GITHUB_OUTPUT"
            else
              echo "mode=existing_file" >> "$GITHUB_OUTPUT"
            fi

            TMP_GIT_DIR=$(mktemp -d)
            git init "$TMP_GIT_DIR" >/dev/null
            base64 -w 0 debug.keystore > "$TMP_GIT_DIR/debug.keystore.base64"
            (
              cd "$TMP_GIT_DIR"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git checkout --orphan ci-signing >/dev/null 2>&1
              git add debug.keystore.base64
              git commit -m "chore: persist CI signing keystore" >/dev/null
              git remote add origin "$(git -C "$GITHUB_WORKSPACE" remote get-url origin)"
              AUTH_HEADER=$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader || true)
              if [ -n "$AUTH_HEADER" ]; then
                git -c "http.https://github.com/.extraheader=$AUTH_HEADER" push origin ci-signing:refs/heads/ci-signing || true
              else
                git push origin ci-signing:refs/heads/ci-signing || true
              fi
            )
            rm -rf "$TMP_GIT_DIR"
          fi

          CERT_SHA256=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            | awk '/SHA256:/ {print $2; exit}')
          if [ -z "$CERT_SHA256" ]; then
            echo "Failed to read signing certificate from debug.keystore"
            exit 1
          fi
          echo "sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "Signing keystore mode: $(grep '^mode=' "$GITHUB_OUTPUT" | cut -d= -f2)"
          echo "Signing certificate SHA-256: $CERT_SHA256"

      - name: Determine release version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            MAX_MINOR=$(git ls-remote --tags --refs origin 'refs/tags/v1.*' \
              | awk -F'refs/tags/v1\\.' '{print $2}' \
              | grep -E '^[0-9]+$' \
              | sort -n \
              | tail -n 1 || true)
            if [ -z "$MAX_MINOR" ]; then
              NEXT_MINOR=1
            else
              NEXT_MINOR=$((10#$MAX_MINOR + 1))
            fi
            VERSION_NAME=$(printf "1.%02d" "$NEXT_MINOR")
          fi
          VERSION_CODE=$(( GITHUB_RUN_NUMBER + 100 ))
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building PlasmaSky v$VERSION_NAME (versionCode=$VERSION_CODE)"

      - name: Build debug APK
        run: gradle :app:assembleDebug -PversionCode=${{ steps.version.outputs.version_code }} -PversionName=${{ steps.version.outputs.version_name }} -PgithubRepo=${{ github.repository }} --no-daemon

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest -PversionCode=${{ steps.version.outputs.version_code }} -PversionName=${{ steps.version.outputs.version_name }} -PgithubRepo=${{ github.repository }} --no-daemon

      - name: Package downloadable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/PlasmaSky-v${{ steps.version.outputs.version_name }}.apk"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlasmaSky-v${{ steps.version.outputs.version_name }}-APK
          path: dist/PlasmaSky-v${{ steps.version.outputs.version_name }}.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: PlasmaSky v${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          body: |
            Automated Android TV / Android build of **PlasmaSky v${{ steps.version.outputs.version_name }}** (`versionCode` ${{ steps.version.outputs.version_code }}).

            ### Easy Install
            Download **`PlasmaSky-v${{ steps.version.outputs.version_name }}.apk`** below and open/sideload it on your Android TV or Android device.
            If updating from an older build signed with a different key results in `"App not installed"`, uninstall the old version once and install this release cleanly.

            Signing certificate (`SHA-256`, mode `${{ steps.keystore.outputs.mode }}`): `${{ steps.keystore.outputs.sha256 }}`
          files: dist/PlasmaSky-v${{ steps.version.outputs.version_name }}.apk
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
