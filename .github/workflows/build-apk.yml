name: Build PlasmaSky APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK path not set"
            exit 1
          fi
          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK_ROOT/licenses/intel-android-extra-license"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare debug signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Determine release version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            MAX_MINOR=$(git ls-remote --tags --refs origin 'refs/tags/v1.*' \
              | awk -F'refs/tags/v1\\.' '{print $2}' \
              | grep -E '^[0-9]+$' \
              | sort -n \
              | tail -n 1 || true)
            if [ -z "$MAX_MINOR" ]; then
              NEXT_MINOR=1
            else
              NEXT_MINOR=$((10#$MAX_MINOR + 1))
            fi
            VERSION_NAME=$(printf "1.%02d" "$NEXT_MINOR")
          fi
          VERSION_CODE=$(( GITHUB_RUN_NUMBER + 100 ))
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building PlasmaSky v$VERSION_NAME (versionCode=$VERSION_CODE)"

      - name: Build debug APK
        run: gradle :app:assembleDebug -PversionCode=${{ steps.version.outputs.version_code }} -PversionName=${{ steps.version.outputs.version_name }} -PgithubRepo=${{ github.repository }} --no-daemon

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest -PversionCode=${{ steps.version.outputs.version_code }} -PversionName=${{ steps.version.outputs.version_name }} -PgithubRepo=${{ github.repository }} --no-daemon

      - name: Package downloadable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/PlasmaSky-v${{ steps.version.outputs.version_name }}.apk"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlasmaSky-v${{ steps.version.outputs.version_name }}-APK
          path: dist/PlasmaSky-v${{ steps.version.outputs.version_name }}.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: PlasmaSky v${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          body: |
            Automated Android TV / Android build of **PlasmaSky v${{ steps.version.outputs.version_name }}**.

            ### Easy Install
            Download **`PlasmaSky-v${{ steps.version.outputs.version_name }}.apk`** below and open/sideload it on your Android TV or Android device.
          files: dist/PlasmaSky-v${{ steps.version.outputs.version_name }}.apk
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
